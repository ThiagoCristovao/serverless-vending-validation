<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo do aplicativo SVV: máquina de vendas com selo de verificação.

  Tela de 108 x 108 unidades, a mesma do ícone adaptativo do Android
  (1 unidade = 1 dp). O grupo "marca" cabe no círculo de raio 32 centrado
  em (54, 54), dentro da zona segura de 66/108 (raio 33). O retângulo
  "fundo" só aparece na logo completa; a camada de frente do ícone
  adaptativo é este arquivo sem ele (ver ferramentas/gerar_icones.py).

  Cores do tema (lib/app/tema.dart): #98D5A4 é o primary do esquema escuro
  gerado a partir da semente #2ECC71; #101418 é o fundo das telas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <rect id="fundo" width="108" height="108" rx="24" fill="#101418"/>
  <g id="marca" transform="translate(54 54) scale(0.94) translate(-22 -28.4)">
    <!-- corpo da máquina -->
    <rect x="0" y="0" width="36" height="50" rx="5" fill="#98D5A4"/>
    <!-- vitrine com seis produtos -->
    <rect x="4" y="5" width="20" height="29" rx="2" fill="#101418"/>
    <g fill="#98D5A4">
      <rect x="7" y="8" width="6" height="5.5" rx="1"/>
      <rect x="15" y="8" width="6" height="5.5" rx="1"/>
      <rect x="7" y="17" width="6" height="5.5" rx="1"/>
      <rect x="15" y="17" width="6" height="5.5" rx="1"/>
      <rect x="7" y="26" width="6" height="5.5" rx="1"/>
      <rect x="15" y="26" width="6" height="5.5" rx="1"/>
    </g>
    <!-- visor, fenda de moedas e bandeja de retirada -->
    <rect x="27" y="5" width="6" height="5" rx="1" fill="#101418"/>
    <rect x="28.9" y="14" width="2.2" height="7.5" rx="1.1" fill="#101418"/>
    <rect x="4" y="39" width="20" height="6" rx="1.5" fill="#101418"/>
    <!-- selo de verificação; o contorno escuro o separa do corpo -->
    <circle cx="34" cy="46" r="11" fill="#98D5A4" stroke="#101418" stroke-width="3.5"/>
    <path d="M28.5 46.2 L32.4 50 L39.5 42.4" fill="none" stroke="#101418"
          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
