# Verificações mínimas da Sprint 0. Roda sem credenciais GCP.
# O job de Flutter (Sprint 6) será adicionado quando houver código do aplicativo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (${{ matrix.diretorio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        diretorio: [infra/bootstrap, infra/ambientes/dev]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
      - name: Formatação
        run: terraform -chdir=${{ matrix.diretorio }} fmt -check -diff -recursive
      - name: Init sem backend
        run: terraform -chdir=${{ matrix.diretorio }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=${{ matrix.diretorio }} validate

  openapi:
    name: OpenAPI (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: redocly lint
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

  go:
    name: Go (servico)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servico
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: servico/go.mod
          cache: false
      - name: gofmt
        run: |
          fora="$(gofmt -l .)"
          if [ -n "$fora" ]; then echo "fora do gofmt:"; echo "$fora"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
