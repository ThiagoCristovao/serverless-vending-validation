# Verificações do repositório. Roda sem credenciais GCP.
# Jobs: Terraform (fmt/validate), OpenAPI (lint), Go (servico, sistema-central-simulado e
# ferramentas/injecao-falhas) e Flutter (aplicativo). A suíte e2e (Sprint 8) e os experimentos
# (Sprint 9) só são compilados aqui; executam com `make e2e` e `make experimento`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (${{ matrix.diretorio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        diretorio: [infra/bootstrap, infra/ambientes/dev]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
      - name: Formatação
        run: terraform -chdir=${{ matrix.diretorio }} fmt -check -diff -recursive
      - name: Init sem backend
        run: terraform -chdir=${{ matrix.diretorio }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=${{ matrix.diretorio }} validate

  openapi:
    name: OpenAPI (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: redocly lint
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

  go:
    name: Go (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo: [servico, sistema-central-simulado, ferramentas/injecao-falhas]
    defaults:
      run:
        working-directory: ${{ matrix.modulo }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.modulo }}/go.mod
          cache: false
      - name: gofmt
        run: |
          fora="$(gofmt -l .)"
          if [ -n "$fora" ]; then echo "fora do gofmt:"; echo "$fora"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go vet da suíte e2e (só compila; executa com make e2e)
        if: matrix.modulo == 'sistema-central-simulado'
        run: go vet -tags e2e ./e2e/
      - name: go test
        run: go test ./... -count=1

  flutter:
    name: Flutter (aplicativo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aplicativo
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get
      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test
